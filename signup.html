<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVELY | Sign up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="wv-auth-page" data-page="auth">
  <header class="p-3"><a class="wv-brand fs-3" href="./index.html">WAVELY</a></header>
  <main class="wv-auth-wrapper d-flex align-items-center justify-content-center px-3 py-5">
    <div class="wv-auth-box">
      <h1 class="h3 fw-bold mb-1">Create your account</h1>
      <p class="text-secondary mb-4">Free forever. Save songs and follow artists.</p>
      <form data-auth novalidate>
        <div class="mb-3">
          <label for="name" class="form-label small text-secondary">Full name</label>
          <input type="text" id="name" class="form-control" placeholder="Your name" autocomplete="name" required>
          <div class="invalid-feedback">Enter your name.</div>
        </div>
        <div class="mb-3">
          <label for="email" class="form-label small text-secondary">Email address</label>
          <input type="email" id="email" class="form-control" placeholder="you@example.com" autocomplete="email" required>
          <div class="invalid-feedback">Enter a valid email address.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small text-secondary">Password</label>
          <input type="password" id="password" class="form-control" placeholder="At least 6 characters" minlength="6" autocomplete="new-password" required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="mb-3">
          <label for="confirm-password" class="form-label small text-secondary">Confirm password</label>
          <input type="password" id="confirm-password" class="form-control" placeholder="Repeat your password" autocomplete="new-password" required>
          <div class="invalid-feedback">Passwords do not match.</div>
        </div>
        <button type="submit" class="btn btn-accent w-100 py-2">Sign up</button>
      </form>
      <p class="mt-4 mb-0 text-secondary small">Already have an account? <a href="./login.html" class="text-white fw-semibold">Log in</a></p>
      <p class="mt-3 mb-0 text-secondary" style="font-size:.75rem">Frontend practice project. Connect a backend later for real accounts.</p>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
