<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVELY | Sign Up</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="wv-auth-page">

    <header class="p-3">
        <a href="./index.html" class="wv-auth-brand" style="font-weight:900;font-size:1.8rem;letter-spacing:-1px;">WAVELY</a>
    </header>

    <main class="wv-auth-wrapper d-flex align-items-center justify-content-center px-3 py-5">
        <div class="wv-auth-box shadow">

            <h1 class="h2 fw-bold mb-4">Create Account</h1>

            <form>
                <div class="mb-3">
                    <label for="name" class="form-label small text-secondary">Full Name</label>
                    <input type="text" id="name" name="name" class="form-control" placeholder="Enter your full name"
                        autocomplete="name" required>
                </div>

                <div class="mb-3">
                    <label for="email" class="form-label small text-secondary">Email Address</label>
                    <input type="email" id="email" name="email" class="form-control"
                        placeholder="Enter your email address" autocomplete="email" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small text-secondary">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Create a password" minlength="6" autocomplete="new-password" required>
                </div>

                <div class="mb-3">
                    <label for="confirm-password" class="form-label small text-secondary">Confirm Password</label>
                    <input type="password" id="confirm-password" name="confirm-password" class="form-control"
                        placeholder="Confirm your password" minlength="6" autocomplete="new-password" required>
                </div>

                <a href="./index.html" class="btn btn-danger w-100 fw-bold py-2 mt-2">Sign Up</a>
            </form>

            <p class="mt-4 mb-0 text-secondary small">
                Already have an account?
                <a href="./login.html" class="text-white fw-semibold">Sign in now.</a>
            </p>

            <p class="mt-3 mb-0 text-secondary" style="font-size:.75rem;">
                This is a frontend practice project. Connect a backend later for real account creation.
            </p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
