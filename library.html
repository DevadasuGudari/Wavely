<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Your liked songs, recent plays, playlists and followed artists.">
  <title>WAVELY | Your Library</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="library">
<div id="app-nav"></div>
<main class="container-fluid px-3 px-lg-5 pt-4">
  <h1 class="page-title">Your library</h1>
  <ul class="nav nav-pills lib-tabs my-4" role="tablist">
    <li class="nav-item"><button class="nav-link active" data-bs-toggle="pill" data-bs-target="#tab-liked" type="button">Liked songs</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-recent" type="button">Recently played</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-following" type="button">Following</button></li>
    <li class="nav-item"><button class="nav-link" data-bs-toggle="pill" data-bs-target="#tab-playlists" type="button">Playlists</button></li>
  </ul>
  <div class="tab-content">
    <div class="tab-pane fade show active" id="tab-liked"><div class="table-responsive"><table class="table song-table align-middle">
      <thead><tr><th class="num">#</th><th>Title</th><th class="d-none d-md-table-cell">Genre</th><th class="text-end">Length</th></tr></thead>
      <tbody data-render="liked" data-kind="row" data-skel="4"></tbody></table></div></div>
    <div class="tab-pane fade" id="tab-recent"><div class="table-responsive"><table class="table song-table align-middle">
      <thead><tr><th class="num">#</th><th>Title</th><th class="d-none d-md-table-cell">Genre</th><th class="text-end">Length</th></tr></thead>
      <tbody data-render="recent" data-kind="row" data-skel="4"></tbody></table></div></div>
    <div class="tab-pane fade" id="tab-following"><div class="row g-3" data-render="following" data-kind="card" data-skel="4"></div></div>
    <div class="tab-pane fade" id="tab-playlists"><div class="row g-3" data-render="playlists" data-kind="card" data-skel="6"></div></div>
  </div>
</main>
<div id="app-footer"></div>
<div id="app-player"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
