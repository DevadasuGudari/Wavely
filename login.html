<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WAVELY | Sign In</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="./style.css">
</head>

<body class="wv-auth-page">

    <header class="p-3">
        <a href="./index.html" class="navbar-brand wv-auth-brand"
            style="font-weight:900;font-size:1.8rem;letter-spacing:-1px;">WAVELY</a>
    </header>

    <main class="wv-auth-wrapper d-flex align-items-center justify-content-center px-3 py-5">
        <div class="wv-auth-box shadow">

            <h1 class="h2 fw-bold mb-4">Sign In</h1>

            <form>
                <div class="mb-3">
                    <label for="email" class="form-label small text-secondary">Email or mobile number</label>
                    <input type="text" id="email" name="email" class="form-control"
                        placeholder="Enter your email or mobile number" required>
                </div>

                <div class="mb-3">
                    <label for="password" class="form-label small text-secondary">Password</label>
                    <input type="password" id="password" name="password" class="form-control"
                        placeholder="Enter your password" required>
                </div>

                <a href="./index.html" class="btn btn-danger w-100 fw-bold py-2 mt-2">Sign In</a>

                <div class="d-flex justify-content-between align-items-center mt-3 small text-secondary">
                    <div class="form-check">
                        <input class="form-check-input" type="checkbox" id="remember" name="remember">
                        <label class="form-check-label" for="remember">Remember me</label>
                    </div>
                    <a href="#" class="text-secondary">Need help?</a>
                </div>
            </form>

            <p class="mt-4 mb-0 text-secondary small">
                New to Wavely?
                <a href="./signup.html" class="text-white fw-semibold">Sign up now.</a>
            </p>

            <p class="mt-3 mb-0 text-secondary" style="font-size:.75rem;">
                This is a frontend practice project. No real authentication is connected.
            </p>

        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>

</html>
