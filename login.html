<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAVELY | Log in</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body class="wv-auth-page" data-page="auth">
  <header class="p-3"><a class="wv-brand fs-3" href="./index.html">WAVELY</a></header>
  <main class="wv-auth-wrapper d-flex align-items-center justify-content-center px-3 py-5">
    <div class="wv-auth-box">
      <h1 class="h3 fw-bold mb-1">Log in to Wavely</h1>
      <p class="text-secondary mb-4">Welcome back. Pick up where you left off.</p>
      <form data-auth novalidate>
        <div class="mb-3">
          <label for="email" class="form-label small text-secondary">Email or mobile number</label>
          <input type="text" id="email" class="form-control" placeholder="you@example.com" autocomplete="username" required>
          <div class="invalid-feedback">Enter your email or mobile number.</div>
        </div>
        <div class="mb-3">
          <label for="password" class="form-label small text-secondary">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Your password" minlength="6" autocomplete="current-password" required>
          <div class="invalid-feedback">Password must be at least 6 characters.</div>
        </div>
        <div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="remember"><label class="form-check-label small text-secondary" for="remember">Remember me</label></div>
        <button type="submit" class="btn btn-accent w-100 py-2">Log in</button>
      </form>
      <p class="mt-4 mb-0 text-secondary small">New to Wavely? <a href="./signup.html" class="text-white fw-semibold">Sign up</a></p>
      <p class="mt-3 mb-0 text-secondary" style="font-size:.75rem">Frontend practice project. No real authentication is connected.</p>
    </div>
  </main>
  <script src="./script.js"></script>
</body>
</html>
