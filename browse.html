<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Browse every Wavely genre and song.">
  <title>WAVELY | Browse</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body data-page="browse">
<div id="app-nav"></div>
<main class="container-fluid px-3 px-lg-5 pt-4">
  <h1 class="page-title">Browse all</h1>
  <p class="text-secondary mb-4">Pick a language to filter the song list below.</p>
  <div class="row g-3" data-render="genres" data-kind="tile" data-skel="8"></div>

  <section class="block px-0" data-block>
    <div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-3">
      <h2 class="section-title" id="songs-title">All songs</h2>
      <div class="chips" data-render="chips" data-instant></div>
    </div>
    <div class="table-responsive">
      <table class="table song-table align-middle">
        <thead><tr><th class="num">#</th><th>Title</th><th class="d-none d-md-table-cell">Language</th><th class="text-end">Length</th></tr></thead>
        <tbody data-render="all" data-kind="row" data-skel="8" data-lang-scope></tbody>
      </table>
    </div>
  </section>
</main>
<div id="app-footer"></div>
<div id="app-player"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="./script.js"></script>
</body>
</html>
